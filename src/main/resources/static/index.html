<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockLá - Gestão de Estoque</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            background-color: #f4f6f9;
            color: #333;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar-header h2 {
            margin-bottom: 30px;
            font-size: 1.6rem;
            color: #3498db;
            text-align: center;
            letter-spacing: 1px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-link {
            color: #ecf0f1;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 6px;
            transition: background 0.3s;
            font-weight: 500;
        }

        .nav-link:hover, .nav-link.active {
            background-color: #34495e;
        }

        .badge-soon {
            background-color: #6c5ce7;
            color: white;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-logout-sidebar {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
        }

        /* Conteudo Principal */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        /* Cards Resumo */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .card h3 {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .card-number, .stat-value, .card p, .stat p {
            font-size: 1.8rem !important;
            font-weight: 700;
            color: #2c3e50;
        }

        /* Formulario */
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .form-container h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 15px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn-add {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .btn-add:hover {
            background-color: #27ae60;
        }

        /* Tabela */
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .table-container h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
            color: #2c3e50;
            font-weight: 600;
        }

        /* Botoes de Acao */
        .btn-action {
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            margin-right: 5px;
            transition: opacity 0.2s;
        }

        .btn-action:hover {
            opacity: 0.85;
        }

        .btn-edit { background-color: #3498db; color: white; }
        .btn-zero { background-color: #f39c12; color: white; }
        .btn-delete { background-color: #e74c3c; color: white; }

        /* Modal Authenticação */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 360px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        .auth-card h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .auth-form input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn-auth {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
        }

        .auth-toggle {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #666;
        }

        .auth-toggle a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-erro {
            color: #e74c3c;
            font-size: 0.85rem;
            display: none;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Modal de Login / Cadastro -->
    <div id="auth-modal" class="auth-overlay">
        <div class="auth-card">
            <h2 id="auth-title">StockLá - Entrar</h2>
            <form class="auth-form" onsubmit="processarAuth(event)">
                <div id="field-nome" class="form-group" style="display: none;">
                    <input type="text" id="auth-nome" placeholder="Seu nome completo">
                </div>
                <div class="form-group">
                    <input type="text" id="auth-user" placeholder="Usuário / E-mail" required>
                </div>
                <div class="form-group">
                    <input type="password" id="auth-pass" placeholder="Senha" required>
                </div>
                <div id="auth-erro" class="auth-erro"></div>
                <button type="submit" id="btn-auth-submit" class="btn-auth">Entrar</button>
            </form>
            <div class="auth-toggle">
                <span id="auth-toggle-text">Não tem uma conta?</span>
                <a onclick="alternarModoAuth()" id="auth-toggle-link">Cadastrar-se</a>
            </div>
        </div>
    </div>

    <!-- Sidebar Lateral -->
    <aside class="sidebar">
        <div>
            <div class="sidebar-header">
                <h2>StockLá</h2>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-link active">📊 Dashboard</a>
                <a href="#" class="nav-link">📦 Estoque</a>
                <a href="#" class="nav-link" style="opacity: 0.6; cursor: not-allowed; display: flex; justify-content: space-between; align-items: center;">
                    🤖 IA Stock <span class="badge-soon">EM BREVE</span>
                </a>
            </nav>
        </div>

        <div>
            <button class="btn-logout-sidebar" onclick="logout()">🚪 Sair</button>
        </div>
    </aside>

    <!-- Conteudo Principal -->
    <main class="main-content">
        <div class="top-bar">
            <h1>Visão Geral do Estoque</h1>
        </div>

        <!-- Cards Estatisticos -->
        <section class="stats-grid">
            <div class="card">
                <h3>Total de Itens</h3>
                <p class="card-number" id="total-itens">0</p>
            </div>
            <div class="card">
                <h3>Valor Total do Estoque</h3>
                <p class="stat-value" id="valor-total">R$ 0,00</p>
            </div>
        </section>

        <!-- Formulario Adicionar Produto -->
        <section class="form-container">
            <h2>Adicionar Novo Item</h2>
            <form id="form-item" onsubmit="cadastrarItem(event)" class="form-grid">
                <div class="form-group">
                    <label for="nome-item">Nome do Produto</label>
                    <input type="text" id="nome-item" placeholder="Ex: Cerveja Heineken 350ml" required>
                </div>
                <div class="form-group">
                    <label for="qtd-item">Quantidade</label>
                    <input type="number" id="qtd-item" placeholder="0" min="0" required>
                </div>
                <div class="form-group">
                    <label for="preco-item">Preço (R$)</label>
                    <input type="number" id="preco-item" placeholder="0.00" step="0.01" min="0" required>
                </div>
                <button type="submit" class="btn-add">➕ Adicionar</button>
            </form>
        </section>

        <!-- Tabela do Estoque -->
        <section class="table-container">
            <h2>Itens em Estoque</h2>
            <table id="tabela-estoque">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Quantidade</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </section>
    </main>

    <!-- JavaScript Lógica do Sistema -->
    <script>
        let modoCadastro = false;

        // Alternar entre Login e Cadastro
        function alternarModoAuth() {
            modoCadastro = !modoCadastro;
            const title = document.getElementById("auth-title");
            const btnSubmit = document.getElementById("btn-auth-submit");
            const toggleText = document.getElementById("auth-toggle-text");
            const toggleLink = document.getElementById("auth-toggle-link");
            const fieldNome = document.getElementById("field-nome");
            const erroEl = document.getElementById("auth-erro");

            erroEl.style.display = "none";

            if (modoCadastro) {
                title.innerText = "StockLá - Criar Conta";
                btnSubmit.innerText = "Cadastrar";
                toggleText.innerText = "Já possui uma conta?";
                toggleLink.innerText = "Fazer Login";
                fieldNome.style.display = "block";
            } else {
                title.innerText = "StockLá - Entrar";
                btnSubmit.innerText = "Entrar";
                toggleText.innerText = "Não tem uma conta?";
                toggleLink.innerText = "Cadastrar-se";
                fieldNome.style.display = "none";
            }
        }

        // Processar Autenticação (Login / Cadastro)
        async function processarAuth(e) {
            if (e) e.preventDefault();
            
            const erroEl = document.getElementById("auth-erro");
            erroEl.style.display = "none";

            const username = document.getElementById("auth-user").value;
            const password = document.getElementById("auth-pass").value;
            const nome = document.getElementById("auth-nome")?.value;

            const endpoint = modoCadastro ? "/api/cadastrar" : "/api/login";
            const corpo = modoCadastro ? { nome, username, password } : { username, password };

            try {
                const res = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(corpo)
                });

                if (res.ok) {
                    document.getElementById("auth-modal").style.display = "none";
                    carregarEstoque();
                } else {
                    const data = await res.json().catch(() => ({}));
                    erroEl.innerText = data.mensagem || "Erro ao realizar autenticação";
                    erroEl.style.display = "block";
                }
            } catch (err) {
                erroEl.innerText = "Erro ao conectar com o servidor";
                erroEl.style.display = "block";
            }
        }

        // Logout
        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
            } catch (e) {}
            localStorage.clear();
            document.getElementById("auth-modal").style.display = "flex";
        }

        // Carregar Itens do Estoque
        async function carregarEstoque() {
            try {
                const res = await fetch('/api/estoque');
                if (res.status === 401) {
                    document.getElementById("auth-modal").style.display = "flex";
                    return;
                }
                
                document.getElementById("auth-modal").style.display = "none";
                const itens = await res.json();
                renderizarTabela(itens);
                atualizarEstatisticas(itens);
            } catch (erro) {
                console.error('Erro ao carregar estoque:', erro);
            }
        }

        // Cadastrar Item
        async function cadastrarItem(e) {
            e.preventDefault();
            const nome = document.getElementById("nome-item").value;
            const quantidade = parseInt(document.getElementById("qtd-item").value);
            const preco = parseFloat(document.getElementById("preco-item").value);

            try {
                const res = await fetch('/api/estoque', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, quantidade, preco })
                });

                if (res.ok) {
                    document.getElementById("form-item").reset();
                    carregarEstoque();
                }
            } catch (err) {
                console.error('Erro ao cadastrar item:', err);
            }
        }

        // Renderizar Tabela com Botões de Ações
        function renderizarTabela(itens) {
            const tbody = document.querySelector('#tabela-estoque tbody');
            if (!tbody) return;

            tbody.innerHTML = '';

            if (itens.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Nenhum item em estoque.</td></tr>';
                return;
            }

            itens.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.nome}</td>
                        <td>${item.quantidade}</td>
                        <td>R$ ${Number(item.preco).toFixed(2)}</td>
                        <td>
                            <button class="btn-action btn-edit" onclick="editarItem(${item.id}, '${item.nome}', ${item.quantidade}, ${item.preco})">✏️ Editar</button>
                            <button class="btn-action btn-zero" onclick="zerarEstoque(${item.id})">⚠️ Zerar</button>
                            <button class="btn-action btn-delete" onclick="excluirItem(${item.id})">🗑️ Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }

        // Atualizar Estatísticas dos Cards
        function atualizarEstatisticas(itens) {
            const totalItensEl = document.getElementById('total-itens');
            const valorTotalEl = document.getElementById('valor-total');

            if (totalItensEl) totalItensEl.innerText = itens.length;

            if (valorTotalEl) {
                const total = itens.reduce((acc, item) => acc + (item.quantidade * item.preco), 0);
                valorTotalEl.innerText = `R$ ${total.toFixed(2)}`;
            }
        }

        // Zerar Estoque
        async function zerarEstoque(id) {
            if (confirm("Deseja zerar a quantidade deste item?")) {
                await fetch(`/api/estoque/${id}/zerar`, { method: 'PATCH' });
                carregarEstoque();
            }
        }

        // Excluir Item
        async function excluirItem(id) {
            if (confirm("Deseja excluir este item permanentemente?")) {
                await fetch(`/api/estoque/${id}`, { method: 'DELETE' });
                carregarEstoque();
            }
        }

        // Editar Item
        async function editarItem(id, nomeAtual, qtdAtual, precoAtual) {
            const novoNome = prompt("Novo nome:", nomeAtual);
            const novaQtd = prompt("Nova quantidade:", qtdAtual);
            const novoPreco = prompt("Novo preço:", precoAtual);

            if (novoNome && novaQtd !== null && novoPreco !== null) {
                await fetch(`/api/estoque/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome: novoNome,
                        quantidade: parseInt(novaQtd),
                        preco: parseFloat(novoPreco)
                    })
                });
                carregarEstoque();
            }
        }

        // Inicialização
        document.addEventListener("DOMContentLoaded", carregarEstoque);
    </script>
</body>
</html>
